<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telesales Live Simulator + ลงทะเบียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#6366f1;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.94);backdrop-filter:blur(12px);color:#fff;padding:10px 12px 8px;box-shadow:0 8px 24px rgba(15,23,42,.28)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:auto}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{position:relative;width:48px;height:48px;flex:none}
.avatar-img{width:48px;height:48px;border-radius:50%;background:#1e293b;overflow:hidden;border:2px solid #334155}.avatar-img img,.pe-img{width:100%;height:100%;object-fit:cover;display:block}.pe-img{width:56px;height:56px;border-radius:50%;flex:none;border:2px solid #e2e8f0}
.avatar-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid #818cf8;opacity:0;transition:.3s}
.avatar-ring.speaking{opacity:1;animation:pulse 1.4s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(.96);box-shadow:0 0 0 0 rgba(129,140,248,.55)}60%{transform:scale(1.04);box-shadow:0 0 0 10px rgba(129,140,248,0)}}
.wt{min-width:0}
.customer-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;gap:6px;align-items:center;font-size:11px;color:#94a3b8;flex-wrap:wrap}
.lvl{background:#334155;color:#e2e8f0;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
.customer-tag{display:none}@media(min-width:560px){.customer-tag{display:inline}}
.timer{display:none;color:#a5b4fc}
.acts{display:flex;gap:6px;align-items:center;flex:none}
.pill{border:0;border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;color:#fff}
.go{background:linear-gradient(135deg,#10b981,#059669)}.end{background:linear-gradient(135deg,#f43f5e,#e11d48)}.ghost{background:#1e293b;border:1px solid #334155}
.icon{display:none;width:38px;height:38px;border-radius:50%;border:0;background:#1e293b;color:#fff;font-size:17px;cursor:pointer}.icon.on{background:var(--amb)}
.status-box{max-width:760px;margin:8px auto 0;font-size:12px;padding:6px 10px;border-radius:10px;background:#1e293b;color:#cbd5e1}
.status-box.active{background:rgba(16,185,129,.2);color:#6ee7b7}.status-box.error{background:rgba(244,63,94,.22);color:#fda4af}.status-box.evaluating{background:rgba(245,158,11,.22);color:#fcd34d}
.page{max-width:760px;margin:0 auto;padding:14px 12px 40px;display:grid;gap:14px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}
.reg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.reg-h h3{margin:0;font-size:18px}.reg-h span{font-size:11px;color:#4338ca;background:#eef2ff;padding:3px 10px;border-radius:99px;font-weight:600}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;font-size:12px;padding:5px 12px;border-radius:99px;background:#f1f5f9;color:var(--mut);white-space:nowrap;font-weight:600}
.chip.done{background:#d1fae5;color:#047857}.chip.now{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.hint{background:#fffbeb;border-left:4px solid var(--amb);padding:8px 12px;font-size:13px;border-radius:8px;margin:6px 0 10px}
.empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:14px}
#regBody label{display:block;font-size:13px;margin:10px 0 3px;color:var(--mut);font-weight:600}
#regBody input,#regBody select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#f8fafc}
#regBody input:focus,#regBody select:focus{border-color:var(--pri);background:#fff}
ul.ck{list-style:none;padding:0;margin:14px 0 0}
ul.ck li{padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:13px;cursor:pointer}
ul.ck li.ok{background:#ecfdf5;border-color:#34d399}
ul.ck li::before{content:"○ "}ul.ck li.ok::before{content:"● ";color:#10b981}
.legal{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;max-height:170px;overflow:auto}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;padding:13px 20px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.nxt{margin-top:12px}
#regBody table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}#regBody td,#regBody th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.good{color:#059669;font-weight:700}.bad{color:#dc2626;font-weight:700}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.eval-card{display:none;padding:18px;background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.eval-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.score-badge{font-size:28px;font-weight:800;color:#6366f1}
.eval-section{margin-bottom:12px}.eval-title{font-weight:700;font-size:14px;margin-bottom:4px}
.text-green{color:#166534}.text-amber{color:#b45309}.text-red{color:#991b1b}
.fatal-box{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:10px;font-size:13px}
.eval-list{margin:0;padding-left:20px;font-size:13px;color:#334155;line-height:1.6}
.btn-download{background:linear-gradient(135deg,#10b981,#059669);display:none}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 14px 22px;max-height:82vh;overflow:auto}
.sheet-in h3{margin:0 0 10px;font-size:17px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pcard.active{border-color:var(--pri);background:#eef2ff}
.pe{font-size:30px}.pt{flex:1;display:flex;flex-direction:column;min-width:0}.pt small{color:var(--mut);font-size:12px}
.pcard .lvl{flex:none}.l-easy{background:#d1fae5!important;color:#047857!important}.l-mid{background:#fef3c7!important;color:#b45309!important}.l-hard{background:#fee2e2!important;color:#b91c1c!important}.l-vhard{background:#7f1d1d!important;color:#fff!important}
</style>
</head>
<body>
<header class="top">
 <div class="bar">
  <div class="who">
   <div class="av"><div id="avatarRing" class="avatar-ring"></div><div id="avatarImg" class="avatar-img">👨‍⚕️</div></div>
   <div class="wt"><div id="customerName" class="customer-name"></div>
    <div class="sub"><span id="customerLevel" class="lvl"></span><span id="customerTag" class="customer-tag"></span><span id="timer" class="timer">⏱ 00:00</span></div></div>
  </div>
  <div class="acts">
   <button id="custBtn" class="pill ghost" onclick="openSheet()">👥 ลูกค้า</button>
   <button id="muteBtn" class="icon btn-mute" title="ปิดไมค์ชั่วคราว">🎙️</button>
   <button id="startBtn" class="pill go">📞 โทร</button>
   <button id="stopBtn" class="pill end" style="display:none">วางสาย</button>
  </div>
 </div>
 <div id="status" class="status-box">สถานะ: พร้อมเชื่อมต่อ</div>
</header>
<div id="customerDesc" hidden></div>
<main class="page">
 <section class="card" id="reg">
  <div class="reg-h"><h3>ลงทะเบียนลูกค้า</h3><span>ข้อมูลสมมติ ไม่เก็บข้อมูล</span></div>
  <div class="rail" id="rail"></div>
  <div id="regBody"></div>
 </section>
 <div id="evalCard" class="eval-card">
  <div class="eval-header"><h3 style="margin:0;font-size:16px">ผลการประเมิน QC</h3><div id="scoreBadge" class="score-badge">0/100</div></div>
  <div class="eval-section"><div class="eval-title text-green">💪 จุดแข็ง</div><ul id="strengthsList" class="eval-list"></ul></div>
  <div class="eval-section"><div class="eval-title text-amber">📌 จุดที่ต้องพัฒนา</div><ul id="improvementsList" class="eval-list"></ul></div>
  <div class="eval-section"><div class="eval-title text-red">🚨 ข้อห้ามวิกฤต</div><div id="fatalBox" class="fatal-box"></div></div>
 </div>
 <button id="retryBtn" class="btn" style="display:none;background:#f59e0b">🔄 ลองวิเคราะห์ QC อีกครั้ง</button>
 <button id="downloadBtn" class="btn btn-download">ดาวน์โหลดรายงานประเมิน (QC Report)</button>
</main>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-in"><h3>เลือกลูกค้า</h3><div id="personaSelector"></div></div></div>

<script>
// ===================== CONFIG (แก้ที่เดียว) =====================
const CONFIG = {
  liveModel: "models/gemini-3.1-flash-live-preview",
  evalModel: "gemini-3.6-flash",
  maxCallSeconds: 600,          // เพิ่มจาก 480 เพราะมีขั้นลงทะเบียนต่อท้ายการขาย
  maxAudioBytes: 3 * 1024 * 1024,
  liveEndpoint: "/api/live",
  evalEndpoint: "/api/evaluate",
  legalText: "ใส่ข้อความรีกัลจริงที่พนักงานต้องอ่านให้ลูกค้าฟังตรงนี้ ให้เหมือนต้นฉบับทุกคำ" // <-- แก้ตรงนี้
};

// ===================== กติกากลางของลูกค้า =====================
const COMMON_RULES = [
 "คุณคือคนจริงที่รับโทรศัพท์จากเซลล์ประกันที่ไม่ได้คาดว่าจะโทรมา ไม่ใช่ AI ไม่ใช่ผู้ช่วย ไม่ใช่โค้ช ห้ามหลุดบทบาท",
 "## วิธีพูด",
 "- พูดสั้น ปกติ 1 ประโยค สูงสุด 2 ประโยค บ่อยครั้งตอบ 2-5 คำ เช่น 'อ๋อ ครับ', 'อืม...' ใช้ภาษาพูดแบบโทรศัพท์จริง",
 "- ห้ามสรุปสิ่งที่พนักงานพูดซ้ำ ห้ามชมเกินจริง ห้ามขอบคุณซ้ำ ห้ามสอนหรือเฉลย ห้ามลงท้ายด้วยคำถามทุกประโยค",
 "- ห้ามพูดซ้ำประโยคหรือคำถามเดิม",
 "## การถาม",
 "- ถามเฉพาะเมื่อฟังไม่ชัด ไม่แน่ใจ หรือฟังดูดีเกินจริง ถามครั้งละ 1 เรื่อง และต้องต่อจากที่พนักงานเพิ่งพูด",
 "- ถ้าพนักงานอธิบายชัดแล้ว ตอบรับสั้นๆ แล้วปล่อยให้พนักงานพูดต่อ",
 "- ถ้าพนักงานเงียบ ให้รอ ถ้าเงียบนานจริงค่อยพูด 'ครับ/ค่ะ?' ครั้งเดียว",
 "- ถ้าพนักงานถามคุณ ตอบตามตัวละครสั้นๆ แล้วหยุด",
 "## ท่าทีต่อการขาย",
 "- ตอนแรกปฏิเสธสุภาพ แต่ถ้าพนักงานตรงกับชีวิตหรือความกังวลของคุณจริง ให้เปิดใจฟัง อย่าใจอ่อนเพราะพนักงานพูดเก่ง",
 "- ห้ามถามหาโปรโมชั่น ส่วนลด ของแถมเด็ดขาด",
 "## เรื่องผลิตภัณฑ์ (ถามเมื่อพนักงานพูดถึงแล้ว ทีละข้อ)",
 "- สุขภาพ/ชดเชยรายได้: ถามว่าต้องโคเปย์ไหม ถ้าพนักงานใช้ศัพท์ 'ดีดักทิเบิล' ให้ทำเป็นไม่แน่ใจแล้วขอให้อธิบายง่ายๆ",
 "- สะสมทรัพย์: ถามตัวเลขเพียง 1 อย่างที่ตรงกับที่พนักงานเพิ่งพูด เช่น IRR ถอนได้ไหม ดอกเบี้ย กำไรเท่าไหร่",
 "## การปิดการขาย",
 "- ไม่ใจอ่อนง่าย กังวลเมื่อถูกขอเลขบัตรประชาชน/บัตรเครดิต ยอมให้เมื่อได้เหตุผลสมเหตุสมผลเท่านั้น",
 "- เมื่อตกลงทำประกัน ถามทิ้งท้าย 1 ข้อ เช่น ตัดเบี้ยตอนไหน คุ้มครองเมื่อไหร่ ยกเลิกได้ไหม"
].join("\n");

function buildInstruction(identity, opener, style) {
  return [identity, "", "## ประโยคแรกเมื่อรับสาย", opener,
    "ห้ามพูดต่อจากนั้น ให้หยุดรอพนักงานพูดก่อน", "", "## สไตล์เฉพาะตัว", style, "", COMMON_RULES].join("\n");
}

// ===================== ลูกค้าทั้งหมด =====================
const personas = {
  dragon: { emoji:"👨‍⚕️", name:"คุณมังกร", tag:"หมอ สายเหตุผล", level:"ระดับ: ยาก", voice:"Charon",
    desc:"ใจเย็น จับจุดพูดเกินจริงเรื่องสุขภาพได้ทันที",
    instruction: buildInstruction(
     "คุณคือ 'คุณมังกร' ผู้ชายวัยทำงาน เป็นคุณหมอ ความรู้ด้านสุขภาพลึก สุขุม พูดนุ่มเป็นเหตุเป็นผล ลงท้าย 'ครับ' เรียกตัวเองว่า 'ผม'",
     "พูดสั้นๆ เช่น 'ฮัลโหลครับ' หรือ 'ครับ โทรมาจากไหนนะครับ'",
     "- ฟังมากกว่าพูด ไม่เห็นด้วยจะพูดตรงแต่สุภาพ\n- จับได้ง่ายเมื่อพนักงานพูดเรื่องสุขภาพไม่ชัดหรือเกินจริง ให้ถามสั้นๆ เฉพาะตอนนั้น\n- ไม่ชอบถูกเร่ง ถ้าโดนกดดันจะเงียบครู่หนึ่งแล้วตอบสั้นลง") },
  fah: { emoji:"👩‍💼", name:"คุณฟ้า", tag:"ฝ่ายบัญชี ละเอียดตัวเลข", level:"ระดับ: กลาง", voice:"Kore",
    desc:"เป็นกันเอง แต่ไม่ผ่านตัวเลขที่ไม่ชัด",
    instruction: buildInstruction(
     "คุณคือ 'คุณฟ้า' ผู้หญิงวัยทำงาน พนักงานฝ่ายบัญชี ละเอียดเรื่องตัวเลข เสียงนุ่มเป็นกันเอง ลงท้าย 'ค่ะ/คะ' เรียกตัวเองว่า 'ฟ้า' บางครั้ง",
     "พูดสั้นๆ เช่น 'ฮัลโหลค่ะ' หรือ 'ค่ะ ติดธุระอยู่นิดหน่อย มีอะไรหรือเปล่าคะ'",
     "- อบอุ่น แต่ถ้าพนักงานพูดตัวเลข/ผลประโยชน์กว้างๆ จะถามให้ชัด 1 เรื่อง\n- ชอบคิดเลขในใจ ถ้ายังไม่เห็นตัวเลขที่คำนวณได้จะยังไม่ตัดสินใจ\n- ถ้าอธิบายดีจะตอบรับสั้นๆ เช่น 'อ๋อ ค่ะ เข้าใจแล้วค่ะ'") },
  somsri: { emoji:"👵", name:"คุณป้าสมศรี", tag:"วัยเกษียณ ระแวงมิจฉาชีพ", level:"ระดับ: ยาก", voice:"Leda",
    desc:"เคยเกือบโดนหลอก ฟังไม่ค่อยทัน ต้องสร้างความไว้ใจ",
    instruction: buildInstruction(
     "คุณคือ 'คุณป้าสมศรี' หญิงสูงวัยเกษียณแล้ว พูดช้า ใจดีแต่ระแวงมิจฉาชีพเพราะเคยเกือบโดนหลอก ลงท้าย 'จ้ะ/ค่ะ' เรียกตัวเองว่า 'ป้า'",
     "พูดสั้นๆ ช้าๆ เช่น 'ฮัลโหล...ใครน่ะ' หรือ 'ใครโทรมาจ๊ะ'",
     "- ถามเรื่องความน่าเชื่อถือ เช่น 'ใช่มิจฉาชีพรึเปล่า' 'ขอเบอร์โทรกลับได้ไหม' ถ้าพนักงานไม่ยืนยันตัวตนชัดเจนจะวางสาย\n- ฟังศัพท์ยากไม่เข้าใจ ขอให้พูดช้าๆ ง่ายๆ ได้\n- กังวลเรื่องค่ารักษาตอนแก่และเป็นภาระลูก แต่ไม่ยอมให้ข้อมูลส่วนตัวง่ายๆ") },
  james: { emoji:"🧑‍💻", name:"น้องเจมส์", tag:"ฟรีแลนซ์ รายได้ไม่แน่นอน", level:"ระดับ: กลาง", voice:"Puck",
    desc:"รีบ ไม่มีเวลา คิดว่าประกันไกลตัว",
    instruction: buildInstruction(
